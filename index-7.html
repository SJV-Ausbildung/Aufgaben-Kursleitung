<style id="sty">/* Layout: slide-like pages inside one calm column. Section tabs on top, one page at a time, Zurück/Weiter below. Edit mode for owners. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#14213D; --muted:#566074; --line:#D8DCE5;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 var(--f-body);

h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:clamp(40px,7vw,68px);font-weight:700}
h2{font-size:clamp(28px,4.4vw,42px);font-weight:700}

p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-block:16px 0}
.logos{display:flex;gap:16px;align-items:center;background:#fff;border-radius:12px;padding:8px 14px}
.logos img{height:40px;width:auto;display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{font:600 15px var(--f-body);padding:8px 18px;border:0;background:transparent;color:var(--ink);cursor:pointer;min-width:52px}

.tabs{display:flex;flex-wrap:wrap;gap:8px}

.page{display:flex;flex-direction:column;gap:22px;min-height:50vh}
.eyebrow{font:600 14px var(--f-body);text-transform:uppercase;letter-spacing:2px;color:var(--accent)}
.lead{font-size:20px;color:var(--muted);max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0}

.tile .big{font:700 40px/1.05 var(--f-display)}

.ag{font:inherit;text-align:left;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0}

.ag .n{font:700 34px/1 var(--f-display);color:var(--accent)}
.ag .t{font:600 22px var(--f-display)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}

td.c,th.c{text-align:center}
.dot{color:var(--accent);font-size:18px}

.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.list li{padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.cardcol{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.dark{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.arrow{color:var(--accent);font-weight:700}
.pager{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font:600 17px var(--f-body);padding:11px 22px;border-radius:10px;text-decoration:none;border:0;cursor:pointer}

.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:16px}
.dlg dt{color:var(--muted)} .dlg dd{margin:0}
.chip{display:inline-block;font:600 13px var(--f-body);background:var(--soft);border-radius:999px;padding:3px 10px;margin-right:6px}

.ebtn{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
.ebar{position:sticky;bottom:0;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:8px}
.ebar input{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);min-width:220px;flex:1 1 220px;background:var(--surface);color:var(--ink)}
body.editing [data-e]{outline:1px dashed var(--accent);outline-offset:2px;border-radius:3px;cursor:text;min-width:1ch;display:inline-block}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.chipb{font:inherit;font-size:15px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:inherit;cursor:pointer;min-height:44px}

.k2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin:12px 0 2px}

.rule{font-weight:600;color:#B3261E;border-left:4px solid #B3261E;padding:8px 12px;max-width:860px;margin-top:20px}
.legend{font-size:15px;margin-top:16px}
@media (prefers-color-scheme:dark){.rule{color:#FF8A80;border-color:#FF8A80}}
.ev{border-left:6px solid #E2231A;margin-bottom:20px}

rter Einwilligung zur Veröffentlichung.", "ek2": "7. Einladung zum Kurs", "ei": "Die Einladung wird in der Regel von Andrea Müller versendet. Versendet die Kursleitung sie selbst, stimmt sie sich vorher mit Andrea ab (Kurskosten, Zahlungsfrist und QR-Code für die Einzahlung) und verwendet die Einladungsvorlage (separates Dokument «Einladungsvorlage SJV-Kurse»), damit alle Teilnehmenden dieselben Informationen erhalten. Kursprogramm und QR-Code werden zusammen versendet, 3 bis 4 Wochen vor Kursbeginn.", "ck": "4. Checkliste", "cl": "Als Hilfestellung steht eine separate Checkliste für die Kursleitung zur Verfügung. Sie ist nicht verbindlich; massgebend ist dieses Dokument.", "h5b": "8. Zuständigkeiten auf einen Blick", "cSt": "Stelle", "cTa": "Aufgabe", "gl": "Interne Arbeitsgrundlage des SJV. Die Urversion ist deutsch; bei Widersprüchen geht die deutsche Version der französischen vor. Genehmigt am 1.9.26 durch die Geschäftsleitung des SJV.", "foot": "Stand August 2026 · Richtlinie genehmigt am 1.9.26", "eEdit": "Texte bearbeiten", "eSave": "Speichern", "eCancel": "Abbrechen", "eHint": "Klicke in einen Text und ändere ihn. Texte gelten pro Sprache: schalte oben zwischen DE und FR um.", "orga": "Organisator ist in der Regel der SJV. Bei Leiterkursen und im Jahr 2027 teilweise bei den MFL ist es der Kanton; die Aufgaben der Kursleitung gelten sinngemäss.", "padk": "Hinweis für das MFE: Fragen und Rückmeldungen zu diesen Aufgaben können die Beteiligten im vorgesehenen Padlet notieren.", "pdfk": "Diese Aufgaben und Fristen stehen im SharePoint als PDF zur Verfügung.", "sjvk": "Das Spesenreglement ist eine Vorgabe des SJV.", "evk": "Wichtig: EvalJS direkt am Kursende", "evt": "Die Evaluation (EvalJS) ist ab 2027 obligatorisch und läuft über die NDS. Die Kursleitung lässt sie direkt am Kursende, noch im Kurs, durchführen.", "bask": "Der Expertenschlüssel ist eine Vorgabe des BASPO."}, "fr": {"eyebrow": "Fédération Suisse de Judo & Ju-Jitsu · Jeunesse+Sport", "title": "Tâches et délais de la direction de cours", "lead": "Préparation · Réalisation · Suivi · Décompte", "home": "Accueil", "prev": "Retour", "next": "Suivant", "n1": "Rôles", "d1": "Qui est responsable de quoi.", "n2": "Avant le cours", "d2": "Calendrier de 6 mois à 4 semaines avant le début du cours.", "n3": "Après le cours", "d3": "Tâches immédiatement après le cours.", "n4": "Frais et clé", "d4": "Règlement des frais, soutien J+S, clé d'encadrement, décompte.", "n5": "Divers", "d5": "Bref rapport, invitation et responsabilités.", "core_k": "Responsabilité principale", "core": "La direction de cours assume la responsabilité opérationnelle de la réalisation du cours sur place. Elle coordonne le cadre du cours et les participantes et participants, vérifie les conditions d'admission et veille à l'administration dans les délais dans la BDNS (sélection, présence, qualification).", "h1": "1. Rôles et responsabilités", "rk": "Direction de cours", "re": "Expertes et experts / responsables de classe", "h2": "2. Calendrier avant le début du cours", "h3": "3. Tâches immédiatement après le cours", "cFrist": "Délai", "cAuf": "Tâche", "cVer": "Responsable", "cOrt": "Lieu / destinataire", "cEmp": "Destinataire", "fn2": "* Il est défini 8 semaines avant le début du cours avec Andrea Müller (coach J+S) qui assume cette tâche.", "h4a": "Règlement des frais pour les expertes et experts J+S", "cPos": "Position", "cAns": "Taux", "cBem": "Remarque", "h4b": "Soutien J+S et clé d'encadrement", "gk": "Principes du soutien J+S", "ek": "Clé d'encadrement", "abk": "Principe de décompte", "h5a": "Bref rapport et invitation", "kbk": "6. Bref rapport pour la communication de la SJV", "kb": "Contenu recommandé : désignation et date du cours · lieu · nombre de participantes et participants · cadre du cours · deux à quatre phrases sur les points forts, les moments d'apprentissage ou les particularités · photo de groupe et autres photos du cours avec consentement clarifié à la publication.", "ek2": "7. Invitation au cours", "ei": "L'invitation est en principe envoyée par Andrea Müller. Si la direction de cours l'envoie elle-même, elle se concerte au préalable avec Andrea (frais de cours, délai de paiement et code QR pour le paiement) et utilise le modèle d'invitation (document séparé « Modèle d'invitation cours SJV »), afin que toutes les participantes et tous les participants reçoivent les mêmes informations. Le programme du cours et le code QR sont envoyés ensemble, 3 à 4 semaines avant le début du cours.", "ck": "4. Liste de contrôle", "cl": "À titre d'aide-mémoire, une liste de contrôle séparée est à la disposition de la direction de cours. Elle n'est pas contraignante ; le présent document fait foi.", "h5b": "8. Responsabilités en un coup d'œil", "cSt": "Service", "cTa": "Tâche", "gl": "Base de travail interne de la SJV. La version originale est en allemand ; en cas de contradiction, la version allemande prévaut sur la française. Approuvée le 1.9.26 par la direction de la SJV.", "foot": "État août 2026 · Directive approuvée le 1.9.26", "eEdit": "Modifier les textes", "eSave": "Enregistrer", "eCancel": "Annuler", "eHint": "Clique dans un texte pour le modifier. Les textes valent par langue : bascule en haut entre DE et FR.", "orga": "L'organisateur est en principe la SJV. Pour les cours de moniteurs et, en 2027, en partie pour les MFL, c'est le canton ; les tâches de la direction de cours s'appliquent par analogie.", "padk": "Remarque pour le MFE : les personnes concernées peuvent noter leurs questions et remarques sur ces tâches dans le Padlet prévu.", "pdfk": "Ces tâches et délais sont disponibles en PDF dans le SharePoint.", "sjvk": "Le règlement des frais est une directive de la SJV.", "evk": "Important : EvalJS directement à la fin du cours", "evt": "L'évaluation (EvalJS) est obligatoire dès 2027 et s'effectue via la BDNS. La direction de cours la fait réaliser directement à la fin du cours, encore pendant le cours.", "bask": "La clé d'encadrement est une directive de l'OFSPO."}, "it": {"eyebrow": "Federazione Svizzera di Judo & Ju-Jitsu · Gioventù+Sport", "title": "Compiti e termini della direzione del corso", "lead": "Preparazione · Svolgimento · Elaborazione successiva · Conteggio", "home": "Inizio", "prev": "Indietro", "next": "Avanti", "n1": "Ruoli", "d1": "Chi è responsabile di cosa.", "n2": "Prima del corso", "d2": "Calendario da 6 mesi a 4 settimane prima dell'inizio del corso.", "n3": "Dopo il corso", "d3": "Compiti subito dopo la fine del corso.", "n4": "Spese e chiave", "d4": "Regolamento spese, sostegno G+S, chiave di esperti, conteggio.", "n5": "Altro", "d5": "Breve rapporto, invito e responsabilità.", "core_k": "Responsabilità principale", "core": "La direzione del corso assume la responsabilità operativa dello svolgimento del corso sul posto. Coordina il quadro del corso e i partecipanti, verifica le condizioni di ammissione e garantisce l'amministrazione entro i termini nella BDNS (selezione, presenza, qualifica).", "orga": "L'organizzatore è di regola la FSJ. Per i corsi monitori e, nel 2027, in parte per i MFL, è il Cantone; i compiti della direzione del corso valgono per analogia.", "padk": "Nota per il MFE: le persone coinvolte possono annotare domande e osservazioni su questi compiti nel Padlet previsto.", "h1": "1. Ruoli e responsabilità", "rk": "Direzione del corso", "re": "Esperte ed esperti / responsabili di classe", "h2": "2. Calendario prima dell'inizio del corso", "h3": "3. Compiti subito dopo la fine del corso", "cFrist": "Termine", "cAuf": "Compito", "cVer": "Responsabile", "cOrt": "Luogo / destinatario", "cEmp": "Destinatario", "fn2": "* Otto settimane prima dell'inizio del corso si stabilisce con Andrea Müller (coach G+S) chi si assume questo compito.", "h4a": "Regolamento spese per le esperte e gli esperti G+S", "cPos": "Posizione", "cAns": "Tariffa", "cBem": "Osservazione", "h4b": "Sostegno G+S e chiave di esperti", "gk": "Principi del sostegno G+S", "ek": "Chiave di esperti", "abk": "Principio di conteggio", "h5a": "Breve rapporto e invito", "kbk": "6. Breve rapporto per la comunicazione della FSJ", "kb": "Contenuto raccomandato: denominazione e data del corso · luogo · numero di partecipanti · quadro del corso · da due a quattro frasi su punti focali, momenti di apprendimento o particolarità · foto di gruppo e altre foto del corso con consenso chiarito alla pubblicazione.", "ek2": "7. Invito al corso", "ei": "L'invito viene di regola inviato da Andrea Müller. Se lo invia la direzione del corso stessa, si accorda prima con Andrea (costi del corso, termine di pagamento e codice QR per il versamento) e utilizza il modello di invito (documento separato «Modello di invito corsi FSJ»), affinché tutti i partecipanti ricevano le stesse informazioni. Programma del corso e codice QR vengono inviati insieme, da 3 a 4 settimane prima dell'inizio del corso.", "ck": "4. Lista di controllo", "cl": "Come aiuto è a disposizione una lista di controllo separata per la direzione del corso. Non è vincolante; fa stato questo documento.", "h5b": "8. Responsabilità in sintesi", "cSt": "Servizio", "cTa": "Compito", "gl": "Base di lavoro interna della FSJ. La versione originale è in tedesco; in caso di contraddizioni prevale la versione tedesca su quelle francese e italiana. Approvata il 1.9.26 dalla direzione della FSJ.", "foot": "Stato agosto 2026 · Direttiva approvata il 1.9.26", "eEdit": "Modifica testi", "eSave": "Salva", "eCancel": "Annulla", "eHint": "Clicca su un testo per modificarlo. I testi valgono per lingua: cambia in alto tra DE, FR e IT.", "pdfk": "Questi compiti e termini sono disponibili in PDF nello SharePoint.", "sjvk": "Il regolamento spese è una direttiva della FSJ.", "evk": "Importante: EvalJS direttamente al termine del corso", "evt": "La valutazione (EvalJS) è obbligatoria dal 2027 e si svolge tramite la BDNS. La direzione del corso la fa svolgere direttamente al termine del corso, ancora durante il corso.", "bask": "La chiave di impiego degli esperti è una direttiva dell'UFSPO."}}, "KL": [["Ist dafür verantwortlich, dass Programm, Planung und Durchführung des Kurses nach den Vorgaben des Kursleitungsdossiers umgesetzt werden. Bei Unklarheiten steht die Ausbildungsverantwortung zur Verfügung.", "Est responsable de la mise en œuvre du programme, de la planification et de la réalisation du cours conformément au dossier de direction de cours. En cas de doute, la personne responsable de la formation est à disposition.", "È responsabile che programma, pianificazione e svolgimento del corso siano attuati secondo le direttive del dossier della direzione del corso. In caso di dubbi è a disposizione il responsabile della formazione."], ["Plant und koordiniert den Kurs in Abstimmung mit der Ausbildungsverantwortung und dem Kurskader (Klassenleitung).", "Planifie et coordonne le cours en accord avec la personne responsable de la formation et le cadre du cours (responsable de classe).", "Pianifica e coordina il corso d'intesa con il responsabile della formazione e con il quadro del corso (responsabile di classe)."], ["Stellt sicher, dass das Programm gemäss J+S-Vorgabe 30 Tage vor Modulbeginn in der NDS hochgeladen ist, das Kurskader bereitsteht und die Teilnehmenden fristgerecht selektiert sind (siehe Zeitachse).", "Veille à ce que le programme soit téléversé dans la BDNS 30 jours avant le début du module (prescription J+S), que le cadre du cours soit prêt et que les participantes et participants soient sélectionnés dans les délais (voir calendrier).", "Garantisce che il programma sia caricato nella BDNS 30 giorni prima dell'inizio del modulo (prescrizione G+S), che il quadro del corso sia pronto e che i partecipanti siano selezionati entro i termini (vedi calendario)."], ["Überprüft vor der Selektion, ob die Angemeldeten die erforderlichen Voraussetzungen erfüllen.", "Vérifie avant la sélection que les personnes inscrites remplissent les conditions requises.", "Verifica prima della selezione che gli iscritti soddisfino i requisiti necessari."], ["Plant das Kurskader gemäss Expertenschlüssel (Abschnitt 5) und gleicht es bei der Selektion mit der Teilnehmerzahl ab.", "Planifie le cadre du cours selon la clé d'encadrement (section 5) et la compare avec l'effectif lors de la sélection.", "Pianifica il quadro del corso secondo la chiave di esperti (sezione 5) e lo confronta con il numero di partecipanti al momento della selezione."], ["Lässt die Teilnehmenden direkt am Kursende die Evaluation (EvalJS) durchführen (ab 2027 obligatorisch, über die NDS).", "Fait réaliser aux participantes et participants, directement à la fin du cours, l'évaluation (EvalJS) (obligatoire dès 2027, via la BDNS).", "Fa svolgere ai partecipanti, direttamente al termine del corso, la valutazione (EvalJS) (obbligatoria dal 2027, tramite la BDNS)."], ["Prüft vor der Qualifikation, ob alle Teilnehmenden die Kursgebühren bezahlt haben (Rückfrage bei Andrea Müller; ob der Zahlungsstatus in der NDS ersichtlich ist, wird geklärt).", "Vérifie avant la qualification que toutes les participantes et tous les participants ont payé les frais de cours (demande à Andrea Müller ; la visibilité du statut de paiement dans la BDNS est en cours de clarification).", "Verifica prima della qualifica che tutti i partecipanti abbiano pagato le tasse del corso (richiesta ad Andrea Müller; se lo stato dei pagamenti sia visibile nella BDNS è da chiarire)."], ["Bestätigt die Qualifikationen in der NDS erst, wenn keine Kursgebühren offen sind.", "Confirme les qualifications dans la BDNS uniquement lorsqu'aucun frais de cours n'est impayé.", "Conferma le qualifiche nella BDNS solo quando non vi sono tasse del corso scoperte."], ["Erfasst zuerst die Anwesenheit, danach die Qualifikation in der NDS. Nach erfolgreicher Qualifikation schliesst Andrea Müller (J+S-Coach SJV) das Modul in der NDS ab und gibt es zur Kontrolle an J+S frei (zweimalige Bestätigung nötig).", "Saisit d'abord la présence, puis la qualification dans la BDNS. Après une qualification réussie, Andrea Müller (coach J+S SJV) clôture le module dans la BDNS et le transmet à J+S pour contrôle (double confirmation nécessaire).", "Registra prima la presenza, poi la qualifica nella BDNS. Dopo una qualifica riuscita, Andrea Müller (coach G+S FSJ) chiude il modulo nella BDNS e lo rilascia a G+S per il controllo (necessaria doppia conferma)."]], "EX": [["Bereiten ihre Ausbildungslektionen und -blöcke vor und setzen das validierte Kursprogramm gemäss Kursleitungsdossier um.", "Préparent leurs leçons et blocs de formation et mettent en œuvre le programme de cours validé conformément au dossier de direction de cours.", "Preparano le loro lezioni e i loro blocchi di formazione e attuano il programma del corso convalidato secondo il dossier della direzione del corso."], ["Beobachten die Teilnehmenden und wirken an den Qualifikationen mit (Empfehlung an die Kursleitung).", "Observent les participantes et participants et contribuent aux qualifications (recommandation à la direction de cours).", "Osservano i partecipanti e collaborano alle qualifiche (raccomandazione alla direzione del corso)."], ["Melden An- und Abwesenheiten sowie besondere Vorkommnisse rechtzeitig an die Kursleitung.", "Annoncent à temps à la direction de cours les présences, les absences et les événements particuliers.", "Annunciano per tempo alla direzione del corso presenze, assenze e avvenimenti particolari."]], "T2": [[["Spätestens 6 Monate vor Kursbeginn", "Au plus tard 6 mois avant le début du cours", "Al più tardi 6 mesi prima dell'inizio del corso"], ["Verfügbarkeit der Räumlichkeiten (Halle / Dojo), Verpflegung und weitere Logistik sicherstellen", "Assurer la disponibilité des locaux (salle / dojo), des repas et de la logistique", "Garantire la disponibilità dei locali (palestra / dojo), del vitto e dell'ulteriore logistica"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["Kursort / Anbieter", "Lieu du cours / prestataire", "Luogo del corso / fornitore"]], [["Spätestens 12 Wochen vor Kursbeginn", "Au plus tard 12 semaines avant le début du cours", "Al più tardi 12 settimane prima dell'inizio del corso"], ["Kurskader gemäss Expertenschlüssel planen (siehe Abschnitt 5; mindestens 1 Expertin oder Experte pro 15 Teilnehmende); bei Überschreitung vorgängig Zustimmung der Ausbildungsverantwortung einholen", "Planifier le cadre du cours selon la clé d'encadrement (voir section 5 ; au moins 1 experte ou expert par tranche de 15 participantes et participants) ; en cas de dépassement, obtenir au préalable l'accord de la personne responsable de la formation", "Pianificare il quadro del corso secondo la chiave di esperti (vedi sezione 5; almeno 1 esperta o esperto ogni 15 partecipanti); in caso di superamento ottenere prima il consenso del responsabile della formazione"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["Expertinnen und Experten / Ausbildungsverantwortung SJV", "Expertes et experts / responsable de la formation SJV", "Esperte ed esperti / responsabile della formazione FSJ"]], [["Laufend, 4 bis 2 Monate vor Kursbeginn", "En continu, de 4 à 2 mois avant le début du cours", "Costantemente, da 4 a 2 mesi prima dell'inizio del corso"], ["Regelmässig den Stand der Anmeldungen prüfen (Zwischenselektion), um die Durchführung des Kurses sicherzustellen und Personen, welche die Voraussetzungen nicht erfüllen, rasch zu informieren", "Vérifier régulièrement l'état des inscriptions (sélection intermédiaire) afin de garantir la tenue du cours et d'informer rapidement les personnes qui ne remplissent pas les conditions", "Verificare regolarmente lo stato delle iscrizioni (selezione intermedia) per garantire lo svolgimento del corso e informare rapidamente le persone che non soddisfano i requisiti"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["NDS / Teilnehmende", "BDNS / participantes et participants", "BDNS / partecipanti"]], [["Spätestens 7 Wochen vor Kursbeginn", "Au plus tard 7 semaines avant le début du cours", "Al più tardi 7 settimane prima dell'inizio del corso"], ["Teilnehmende selektieren, Voraussetzungen der Angemeldeten überprüfen, Expertenschlüssel mit der Teilnehmerzahl abgleichen", "Sélectionner les participantes et participants, vérifier les conditions des personnes inscrites, comparer la clé d'encadrement avec l'effectif", "Selezionare i partecipanti, verificare i requisiti degli iscritti, confrontare la chiave di esperti con il numero di partecipanti"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["NDS", "BDNS", "BDNS"]], [["Spätestens 6 Wochen vor Kursbeginn", "Au plus tard 6 semaines avant le début du cours", "Al più tardi 6 settimane prima dell'inizio del corso"], ["Vollständiges Kursprogramm der Ausbildungsverantwortung zur Validierung senden", "Envoyer le programme complet du cours à la personne responsable de la formation pour validation", "Inviare il programma completo del corso al responsabile della formazione per la convalida"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["Ausbildungsverantwortung SJV", "Responsable de la formation SJV", "Responsabile della formazione FSJ"]], [["Spätestens 5 Wochen vor Kursbeginn", "Au plus tard 5 semaines avant le début du cours", "Al più tardi 5 settimane prima dell'inizio del corso"], ["Programm nach erfolgter Validierung eigenständig in der NDS hochladen", "Après validation, téléverser le programme de manière autonome dans la BDNS", "Dopo la convalida, caricare autonomamente il programma nella BDNS"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["NDS", "BDNS", "BDNS"]], [["Spätestens 5 Wochen vor Kursbeginn", "Au plus tard 5 semaines avant le début du cours", "Al più tardi 5 settimane prima dell'inizio del corso"], ["Anwesenheit des Kurskaders sicherstellen", "Assurer la présence du cadre du cours", "Garantire la presenza del quadro del corso"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["NDS / Kurskader", "BDNS / cadre du cours", "BDNS / quadro del corso"]], [["Spätestens 4 Wochen vor Kursbeginn", "Au plus tard 4 semaines avant le début du cours", "Al più tardi 4 settimane prima dell'inizio del corso"], ["Falls vorhanden: Voraufgabe an die Teilnehmenden versenden oder deren Zustellung sicherstellen (kann auch Teil des Kursprogramms sein)", "Le cas échéant : envoyer la tâche préparatoire aux participantes et participants ou s'assurer qu'elle leur est remise (peut aussi faire partie du programme du cours)", "Se presente: inviare il compito preparatorio ai partecipanti o garantirne la consegna (può far parte del programma del corso)"], ["Kursleitung", "Direction de cours", "Direzione del corso"], ["Teilnehmende", "Participantes et participants", "Partecipanti"]], [["Spätestens 3 bis 4 Wochen vor Kursbeginn", "Au plus tard 3 à 4 semaines avant le début du cours", "Da 3 a 4 settimane prima dell'inizio del corso"], ["Einladung mit validiertem Kursprogramm und QR-Code für die Einzahlung an die Teilnehmenden versenden (Inhalt gemäss Einladungsvorlage, Abschnitt 7; auch direkt über die NDS möglich) und daran erinnern, dass die Teilnahme in der NDS bestätigt werden muss", "Envoyer aux participantes et participants l'invitation avec le programme validé et le code QR pour le paiement (contenu selon le modèle d'invitation, section 7 ; envoi aussi possible directement via la BDNS) et rappeler que la participation doit être confirmée dans la BDNS", "Inviare ai partecipanti l'invito con il programma convalidato e il codice QR per il versamento (contenuto secondo il modello di invito, sezione 7; possibile anche direttamente tramite la BDNS) e ricordare che la partecipazione va confermata nella BDNS"], ["Kursleitung / Andrea Müller (J+S-Coach SJV)*", "Direction de cours / Andrea Müller (coach J+S SJV)*", "Direzione del corso / Andrea Müller (coach G+S FSJ)*"], ["Teilnehmende", "Participantes et participants", "Partecipanti"]]], "T3": [[["Direkt am Kursende, noch im Kurs", "Directement à la fin du cours, encore pendant le cours", "Direttamente al termine del corso, ancora durante il corso"], ["Evaluation (EvalJS) durchführen lassen (ab 2027 obligatorisch, über die NDS)", "Faire réaliser l'évaluation (EvalJS) (obligatoire dès 2027, via la BDNS)", "Far svolgere la valutazione (EvalJS) (obbligatoria dal 2027, tramite la BDNS)"], ["Kursleitung / NDS", "Direction de cours / BDNS", "Direzione del corso / BDNS"]], [["Unmittelbar", "Immédiatement", "Immediatamente"], ["Kurzbericht mit Gruppenbild und weiteren Kursfotos an die Ausbildungsverantwortung senden", "Envoyer à la personne responsable de la formation un bref rapport avec photo de groupe et autres photos du cours", "Inviare al responsabile della formazione un breve rapporto con foto di gruppo e altre foto del corso"], ["Bruno Tsafack", "Bruno Tsafack", "Bruno Tsafack"]], [["Spätestens 3 Tage nach Kursabschluss", "Au plus tard 3 jours après la fin du cours", "Al più tardi 3 giorni dopo la fine del corso"], ["Anwesenheit der Teilnehmenden und des Kurskaders erfassen und kontrollieren", "Saisir et contrôler la présence des participantes et participants et du cadre du cours", "Registrare e controllare la presenza dei partecipanti e del quadro del corso"], ["NDS", "BDNS", "BDNS"]], [["Spätestens 3 Tage nach Kursabschluss, vor der Qualifikation", "Au plus tard 3 jours après la fin du cours, avant la qualification", "Al più tardi 3 giorni dopo la fine del corso, prima della qualifica"], ["Offene Kursgebühren bei Andrea Müller erfragen; keine Qualifikation bei offenen Gebühren", "Demander à Andrea Müller les frais de cours impayés ; pas de qualification en cas de frais impayés", "Chiedere ad Andrea Müller le tasse del corso scoperte; nessuna qualifica in caso di tasse scoperte"], ["Andrea Müller (J+S-Coach SJV)", "Andrea Müller (coach J+S SJV)", "Andrea Müller (coach G+S FSJ)"]], [["Spätestens 7 Tage", "Au plus tard 7 jours", "Al più tardi 7 giorni"], ["Qualifikation in der NDS erfassen; anschliessend schliesst Andrea Müller das Modul in der NDS ab und gibt es zur Kontrolle an J+S frei (zweimalige Bestätigung nötig; nur bei bezahlten Kursgebühren)", "Saisir la qualification dans la BDNS ; Andrea Müller clôture ensuite le module dans la BDNS et le transmet à J+S pour contrôle (double confirmation nécessaire ; uniquement si les frais de cours sont payés)", "Registrare la qualifica nella BDNS; Andrea Müller chiude poi il modulo nella BDNS e lo rilascia a G+S per il controllo (necessaria doppia conferma; solo se le tasse del corso sono pagate)"], ["NDS / Andrea Müller (J+S-Coach SJV)", "BDNS / Andrea Müller (coach J+S SJV)", "BDNS / Andrea Müller (coach G+S FSJ)"]], [["Spätestens 10 Tage", "Au plus tard 10 jours", "Al più tardi 10 giorni"], ["Abrechnung einreichen", "Remettre le décompte", "Presentare il conteggio"], ["Bruno Tsafack", "Bruno Tsafack", "Bruno Tsafack"]]], "T4": [[["Kursorganisation (Kurs von 1–2 Kurstagen)", "Organisation du cours (cours de 1 à 2 jours)", "Organizzazione del corso (corso di 1–2 giorni)"], ["150.– CHF pro Kurs", "150.– CHF par cours", "150.– CHF per corso"], ["Pauschale für die Kursleitung; Ansatz nach Kursdauer", "Forfait pour la direction de cours ; taux selon la durée du cours", "Forfait per la direzione del corso; tariffa secondo la durata del corso"]], [["Kursorganisation (Kurs ab 3 Kurstagen)", "Organisation du cours (cours dès 3 jours)", "Organizzazione del corso (corso da 3 giorni)"], ["200.– CHF pro Kurs", "200.– CHF par cours", "200.– CHF per corso"], ["Pauschale für die Kursleitung; Ansatz nach Kursdauer", "Forfait pour la direction de cours ; taux selon la durée du cours", "Forfait per la direzione del corso; tariffa secondo la durata del corso"]], [["Kursleitung / Unterricht", "Direction de cours / enseignement", "Direzione del corso / insegnamento"], ["400.– CHF pro Tag", "400.– CHF par jour", "400.– CHF al giorno"], ["Für Klassenleitung und/oder Kursleitung", "Pour les responsables de classe et/ou la direction de cours", "Per la responsabilità di classe e/o la direzione del corso"]], [["Bereitstellung Dojo", "Mise à disposition du dojo", "Messa a disposizione del dojo"], ["200.– CHF pro Tag", "200.– CHF par jour", "200.– CHF al giorno"], ["", "", ""]], [["Km-Entschädigung", "Indemnité kilométrique", "Indennità chilometrica"], ["0.70 CHF/km", "0.70 CHF/km", "0.70 CHF/km"], ["", "", ""]], [["Verpflegung Teilnehmende", "Repas des participantes et participants", "Vitto dei partecipanti"], ["max. 25.– CHF pro Person und Tag", "max. 25.– CHF par personne et par jour", "max. 25.– CHF per persona e giorno"], ["inklusive", "inclus", "incluso"]]], "GR": [["50 CHF pro Teilnehmerin bzw. Teilnehmer mit A-Profil und Kurstag.", "50 CHF par participante ou participant de profil A et par jour de cours.", "50 CHF per partecipante con profilo A e giorno di corso."], ["Diese Unterstützung wird auf der Basis von 15 Teilnehmenden pro registrierter Expertin bzw. registriertem Experten gewährt.", "Ce soutien est accordé sur la base de 15 participantes et participants par experte enregistrée ou expert enregistré.", "Questo sostegno viene concesso sulla base di 15 partecipanti per esperta o esperto registrato."]], "EK": [["Bis 15 Teilnehmende: 1 Expertin oder Experte.", "Jusqu'à 15 participantes et participants : 1 experte ou expert.", "Fino a 15 partecipanti: 1 esperta o esperto."], ["16 bis 30 Teilnehmende: 2 Expertinnen oder Experten.", "De 16 à 30 participantes et participants : 2 expertes ou experts.", "Da 16 a 30 partecipanti: 2 esperte o esperti."], ["Ab 31 Teilnehmenden: 3 Expertinnen oder Experten.", "Dès 31 participantes et participants : 3 expertes ou experts.", "Da 31 partecipanti: 3 esperte o esperti."], ["Bei zweisprachigen Kursen oder Kursen mit Teilnehmenden aus beiden Sportarten ist es sinnvoll, eine zusätzliche Expertin oder einen zusätzlichen Experten einzuplanen.", "Pour les cours bilingues ou les cours réunissant des participantes et participants des deux sports, il est judicieux de prévoir une experte ou un expert supplémentaire.", "Per i corsi bilingui o i corsi con partecipanti di entrambi gli sport è opportuno prevedere un'esperta o un esperto supplementare."], ["Empfehlung: Mindestens zwei Expertinnen oder Experten einplanen, auch bei bis zu 15 Teilnehmenden, damit ein möglicher Ausfall aufgefangen werden kann.", "Recommandation : prévoir au moins deux expertes ou experts, même jusqu'à 15 participantes et participants, afin de pouvoir pallier une éventuelle absence.", "Raccomandazione: prevedere almeno due esperte o esperti, anche fino a 15 partecipanti, per poter compensare un'eventuale assenza."], ["Dies gilt nicht automatisch. Jede Überschreitung des Expertenschlüssels ist nur mit vorgängiger Zustimmung der Ausbildungsverantwortung möglich.", "Cela ne s'applique pas automatiquement. Tout dépassement de la clé d'encadrement nécessite l'accord préalable de la personne responsable de la formation.", "Ciò non vale automaticamente. Ogni superamento della chiave di esperti è possibile solo con il previo consenso del responsabile della formazione."]], "AB": [["Abgerechnet werden nur genehmigte und nachvollziehbar belegte Aufwendungen. Pauschalen oder Funktionen dürfen nicht doppelt verrechnet werden, sofern keine ausdrückliche vorgängige Genehmigung durch die Ausbildungsverantwortung vorliegt.", "Seules les dépenses approuvées et justifiées de manière vérifiable sont décomptées. Les forfaits ou fonctions ne peuvent pas être facturés à double, sauf approbation préalable expresse de la personne responsable de la formation.", "Vengono conteggiate solo le spese approvate e documentate in modo verificabile. Forfait o funzioni non possono essere fatturati due volte, salvo espressa approvazione preventiva del responsabile della formazione."], ["Die Abrechnung erfolgt ausschliesslich über das offizielle Abrechnungsformular des SJV. Die Vorlage steht der Kursleitung im neuen SharePoint zur Verfügung.", "Le décompte s'effectue exclusivement au moyen du formulaire de décompte officiel de la SJV. Le modèle est à la disposition de la direction de cours dans le nouveau SharePoint.", "Il conteggio avviene esclusivamente tramite il modulo di conteggio ufficiale della FSJ. Il modello è a disposizione della direzione del corso nel nuovo SharePoint."], ["Die Abrechnung wird von der Ausbildungsverantwortung überprüft und validiert. Ohne Validierung ist sie nicht zur Auszahlung freigegeben.", "Le décompte est contrôlé et validé par la personne responsable de la formation. Sans validation, il n'est pas libéré pour le paiement.", "Il conteggio viene verificato e convalidato dal responsabile della formazione. Senza convalida non è sbloccato per il pagamento."]], "T8": [[["Ausbildungsverantwortung SJV · bruno.tsafack@sjv.ch", "Responsable de la formation SJV · bruno.tsafack@sjv.ch", "Responsabile della formazione FSJ · bruno.tsafack@sjv.ch"], ["Validierung des Kursprogramms; erhält Kurzbericht und Abrechnung als Erste oder Erster von der Kursleitung; prüft und validiert die Abrechnung und leitet sie anschliessend an Andrea Müller weiter", "Validation du programme du cours ; reçoit en premier le bref rapport et le décompte de la direction de cours ; contrôle et valide le décompte, puis le transmet à Andrea Müller", "Convalida del programma del corso; riceve per primo dalla direzione del corso il breve rapporto e il conteggio; verifica e convalida il conteggio e lo inoltra poi ad Andrea Müller"]], [["Andrea Müller · J+S-Coach SJV · Andrea.mueller@sjv.ch", "Andrea Müller · coach J+S SJV · Andrea.mueller@sjv.ch", "Andrea Müller · coach G+S FSJ · Andrea.mueller@sjv.ch"], ["Erhält die validierte Abrechnung von der Ausbildungsverantwortung; Prüfung der Kursabrechnung; Auszahlung erst nach Validierung. Schliesst das Modul nach erfolgreicher Qualifikation in der NDS ab", "Reçoit le décompte validé de la personne responsable de la formation ; contrôle du décompte du cours ; paiement uniquement après validation. Clôture le module dans la BDNS après une qualification réussie", "Riceve il conteggio convalidato dal responsabile della formazione; verifica del conteggio del corso; pagamento solo dopo la convalida. Chiude il modulo nella BDNS dopo una qualifica riuscita"]], [["Kursleitung", "Direction de cours", "Direzione del corso"], ["Gesamtkoordination, Zulassungsprüfung, NDS-Administration (Selektion, Anwesenheit, Qualifikation), Durchführung", "Coordination générale, contrôle de l'admission, administration BDNS (sélection, présence, qualification), réalisation ", "Coordinamento generale, verifica dell'ammissione, amministrazione BDNS (selezione, presenza, qualifica), svolgimento"]], [["Expertinnen und Experten / Klassenleitungen", "Expertes et experts / responsables de classe", "Esperte ed esperti / responsabili di classe"], ["Fachliche Durchführung, Beobachtung und Mitwirkung an der Qualifikation", "Réalisation technique, observation et participation à la qualification ", "Svolgimento tecnico, osservazione e collaborazione alla qualifica"]]]}</script>
